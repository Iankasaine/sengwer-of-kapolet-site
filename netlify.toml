[build]
  # Runs on every deploy, including deploys triggered by the Airtable webhook.
  command = "npm run build"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# projects.json must never be cached, or the client will edit Airtable,
# rebuild, and still see the old list for hours.
[[headers]]
  for = "/projects.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Project images are content-hashed in their filename, so they can cache hard.
[[headers]]
  for = "/images/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
